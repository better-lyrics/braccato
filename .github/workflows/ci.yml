name: CI

# The gate AGENTS.md lists, on every pull request: what merges to master is published.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint, typecheck and test
    runs-on: ubuntu-latest
    env:
      # Fail rather than skip @braccato/core-rs when the Rust toolchain is missing.
      BRACCATO_REQUIRE_RUST: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-rs

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Self-checks
        run: pnpm selfcheck
