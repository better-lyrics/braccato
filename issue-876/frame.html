<!doctype html><html lang="en"><head><meta charset="utf-8"><script>

for(const href of ['/'+version+'-core/styles/variables.css','/'+version+'-core/styles/lyrics.css',version==='before'?'/before-misc.css':'/public/css/blyrics/misc.css','/public/fonts/fonts.css','https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Noto+Sans+HK:wght@700&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+TC:wght@700&display=swap']){const link=document.createElement('link');link.rel='stylesheet';link.href=href;document.head.append(link);}

</style></head><body><script type="module">

if(contexts){injectRomanization(document,line.lyricElement,line,'umi no koe');if(version==='after')injectTranslation(document,line.lyricElement,'海之聲','zh-TW');else injectTranslation(document,line.lyricElement,'海之聲');const translation=line.lyricElement.querySelector('.blyrics--translated');translation.id='translation';const translationHeading=document.createElement('div');translationHeading.className='role';translationHeading.textContent='Traditional Chinese translation · zh-TW';line.lyricElement.insertBefore(translationHeading,translation);window.proofSamples.push({id:'translation',role:'Translation',language:'zh-TW',original:false});const translationInfo=document.createElement('div');translationInfo.className='font-evidence';translationInfo.id='evidence-translation';line.lyricElement.append(translationInfo);line.lyricElement.insertBefore(info,line.lyricElement.querySelector('.blyrics--romanized'));const romanized=line.lyricElement.querySelector('.blyrics--romanized');const tag=document.createElement('div');tag.className='font-evidence';tag.textContent='Romanization lang: '+(romanized.getAttribute('lang')||'(inherited '+document.documentElement.lang+')');romanized.after(tag);}

await Promise.all(['HK','JP','KR','SC','TC'].map(region=>document.fonts.load('700 76px "Noto Sans '+region+'"','刃直海角骨入海の声海之聲')));await document.fonts.ready;

</script></body></html>
