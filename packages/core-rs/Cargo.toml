[package]
name = "braccato-core-rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "The braccato lyrics renderer, drawn with WebGL2 from Rust."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
unicode-segmentation = "1"

[build-dependencies]
# Only the build script uses naga, to check the WGSL shaders and translate them to GLSL.
naga = { version = "30", default-features = false, features = ["wgsl-in", "glsl-out"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console", "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "TextMetrics", "WebGl2RenderingContext", "WebGlProgram",
  "WebGlShader", "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation",
  "WebGlVertexArrayObject", "Node", "Text", "Range", "DomRect", "DomRectList",
  "CssStyleDeclaration", "Performance", "MediaQueryList", "Path2d", "DomTokenList", "TreeWalker", "DomMatrix", "HtmlMediaElement", "Event", "EventTarget", "CustomEvent", "CustomEventInit", "MouseEvent", "ResizeObserver", "ResizeObserverEntry", "FontFaceSet", "HtmlStyleElement", "HtmlHeadElement", "AddEventListenerOptions", "ImageData", "HtmlCollection", "WebGlQuery",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
